<div class="container mt-5">

  @if (product()) {

    <div class="product-details">
      

      <!-- Product Image -->
      <div class="product-image">
        @if (product()?.imageUrl) {
          <img
            [src]="product()?.imageUrl"
            [alt]="product()?.name">
        } @else {
          <div class="no-image">
            No Image Available
          </div>
        }
      </div>

      <!-- Product Information -->
      <div class="product-info">

        <h1>{{ product()?.name }}</h1>

        <p class="description">
          {{ product()?.description }}
        </p>

        <div class="price">
          ₹{{ product()?.price }}
        </div>

        <div class="stock">
          Available: {{ product()?.quantity }}
        </div>

        <button class="btn btn-primary" (click)="$event.stopPropagation();">
          Add to Cart
        </button>

      </div>

    </div>

  } @else {

    <div class="loading">
      Loading product...
    </div>

  }

</div>

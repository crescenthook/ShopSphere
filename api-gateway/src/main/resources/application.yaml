spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/**
            - id: product-service-api-docs
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product-service/v3/api-docs
              filters:
                - RewritePath=/product-service/v3/api-docs, /v3/api-docs

            - id: category-service
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/categories/**
            - id: category-service-api-docs
              uri: lb://CATEGORY-SERVICE
              predicates:
                - Path=/category-service/v3/api-docs
              filters:
                - RewritePath=/category-service/v3/api-docs, /v3/api-docs

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
            - id: auth-service-api-docs
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/v3/api-docs, /v3/api-docs

            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/**
            - id: wishlist-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/wishlist/**
            - id: cart-service-api-docs
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart-service/v3/api-docs
              filters:
                - RewritePath=/cart-service/v3/api-docs, /v3/api-docs

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**
            - id: inventory-service-api-docs
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory-service/v3/api-docs
              filters:
                - RewritePath=/inventory-service/v3/api-docs, /v3/api-docs

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**
            - id: order-service-api-docs
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/v3/api-docs, /v3/api-docs

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payments/**
            - id: payment-service-api-docs
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment-service/v3/api-docs
              filters:
                - RewritePath=/payment-service/v3/api-docs, /v3/api-docs


server:
  port: 8080

eureka:
  instance:
    hostname: api-gateway

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
jwt:
  secret: my-super-secret-key-for-shopshere-jwt-token-generation

springdoc:
  swagger-ui:
    urls:
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Category Service
        url: /category-service/v3/api-docs
      - name: Auth Service
        url: /auth-service/v3/api-docs
      - name: Cart Service
        url: /cart-service/v3/api-docs
      - name: Inventory Service
        url: /inventory-service/v3/api-docs
      - name: Order Service
        url: /order-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
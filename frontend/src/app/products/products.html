<div class="container mt-5">

  <h2 class="mb-4">{{ categoryName()? categoryName() +  ' Products' : 'Products'}}</h2>

  <div class="row">

    @for (product of products(); track product.id) {

      <div class="col-md-4 mb-4">
        <div class="card card h-100 shadow-sm">
          <div class="card-body">

            <h5 class="card-title">
              {{ product.name }}
            </h5>

            <p class="card-text">
              {{ product.description }}
            </p>

            <h6 class="text-primary">
                ₹{{ product.price }}
            </h6>

            <p class="text-muted">
              Available: {{ product.quantity }}
            </p>

            <button class="btn btn-primary">
              Add to Cart
            </button>

          </div>
        </div>
      </div>

    }

  </div>

</div>
